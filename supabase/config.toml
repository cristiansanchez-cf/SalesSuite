# Configuración para la CLI de Supabase (`supabase start` en local, `supabase link` + `db push` en la nube).
# Las opciones de Auth de aquí SOLO aplican al entorno local; en la nube se configuran en el panel (docs/SETUP.md §3).
project_id = "salessuite"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:4321"
additional_redirect_urls = ["http://localhost:4321/**", "http://*.localhost:4321/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Alta cerrada: solo por invitación (consola /admin/team o script de alta).
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
max_frequency = "60s"
otp_expiry = 3600
# Código de 6 dígitos en el correo de acceso (plantilla magic_link: {{ .Token }}).
otp_length = 6

[auth.email.template.invite]
subject = "Te han invitado"
content_path = "./supabase/templates/invite.html"

[auth.email.template.confirmation]
subject = "Confirma tu email"
content_path = "./supabase/templates/confirm_signup.html"

[auth.email.template.magic_link]
subject = "Tu código para entrar"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.recovery]
subject = "Elige una contraseña nueva"
content_path = "./supabase/templates/recovery.html"
