<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elige una contraseña nueva</title></head>
<body style="margin:0;background:#faf9f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a">
<!-- Estilo: docs/acceso-sin-contrasena (fondo #faf9f7, tarjeta blanca radio 12, padding 32, botón principal #1a1a1a, secundario #f4f2ef). -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf9f7"><tr><td align="center" style="padding:32px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px"><tr><td style="padding:32px">
<h1 style="font-size:22px;line-height:1.3;margin:0 0 16px;color:#1a1a1a">Elige una contraseña nueva</h1>
<p style="font-size:15px;line-height:1.5;margin:0 0 24px;color:#4a4a4a">Pulsa el botón para elegir una contraseña nueva.</p>
<p style="font-size:15px;line-height:1.5;margin:0 0 16px;color:#4a4a4a">El enlace caduca en una hora. Recuerda que también puedes entrar sin contraseña, con un código por email.</p>
<p style="margin:0 0 24px"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery" style="display:inline-block;background:#1a1a1a;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:8px">Elegir contraseña</a></p>
<p style="font-size:13px;line-height:1.5;color:#8a8a8a;margin:0">Si no lo has pedido tú, ignora este correo: tu contraseña no cambia.</p>
</td></tr></table>
</td></tr></table>
</body></html>
