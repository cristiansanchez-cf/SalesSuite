<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirma tu email</title></head>
<body style="margin:0;background:#faf9f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1a1a1a">
<!-- Estilo: docs/acceso-sin-contrasena (fondo #faf9f7, tarjeta blanca radio 12, padding 32, botón principal #1a1a1a, secundario #f4f2ef). -->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf9f7"><tr><td align="center" style="padding:32px 16px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:12px"><tr><td style="padding:32px">
<h1 style="font-size:22px;line-height:1.3;margin:0 0 16px;color:#1a1a1a">Confirma tu email</h1>
<p style="font-size:15px;line-height:1.5;margin:0 0 12px;color:#4a4a4a">Escribe este código en la pantalla de acceso:</p>
<p style="font-size:32px;font-weight:700;letter-spacing:8px;margin:0 0 24px;color:#1a1a1a;font-family:ui-monospace,SFMono-Regular,Menlo,monospace">{{ .Token }}</p>
<p style="font-size:15px;line-height:1.5;margin:0 0 16px;color:#4a4a4a">O confirma con el botón desde este mismo dispositivo. Caduca en una hora.</p>
<p style="margin:0 0 24px"><a href="{{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=email" style="display:inline-block;background:#f4f2ef;color:#1a1a1a;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:8px">Confirmar con un clic</a></p>
<p style="font-size:13px;line-height:1.5;color:#8a8a8a;margin:0">Si no esperabas este correo, puedes ignorarlo.</p>
</td></tr></table>
</td></tr></table>
</body></html>
