# Producción sin terminal (docs/PUESTA_EN_MARCHA.md): GitHub → Actions → «Producción» → Run workflow.
# Secretos (Settings → Secrets and variables → Actions): SUPABASE_DB_URL, PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY y,
# para «traducir» (contenido en otros idiomas, docs/I18N.md §Contenido), ANTHROPIC_API_KEY.
name: Producción
run-name: "Producción · ${{ inputs.what }} · ${{ inputs.tenant }} · ${{ inputs.dry_run && 'PRUEBA (no escribe)' || 'REAL' }}"

on:
  workflow_dispatch:
    inputs:
      what:
        description: Qué hacer
        type: choice
        options: [migraciones, alta-espacio, las-dos, dossiers-ejemplo, traducir, superadmin, informe-crm]
        default: migraciones
      tenant:
        description: Espacio (carpeta de tenants/)
        type: string
        default: enjoy
      admin_email:
        description: Email del admin al que invitar (opcional). En dossiers-ejemplo, su autor (si no, el admin más antiguo). En superadmin, quién lo será
        type: string
        default: ''
      dry_run:
        description: Solo comprobar, sin escribir nada
        type: boolean
        default: true

concurrency: production

jobs:
  run:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - name: Ocultar el email en los registros
        if: ${{ inputs.admin_email != '' }}
        run: echo "::add-mask::${{ inputs.admin_email }}"

      - name: Comprobar secretos
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          WHAT: ${{ inputs.what }}
          DRY: ${{ inputs.dry_run }}
        run: |
          missing=""
          if [ "$WHAT" != "alta-espacio" ] && [ "$WHAT" != "dossiers-ejemplo" ] && [ "$WHAT" != "superadmin" ] && [ "$WHAT" != "traducir" ] && [ -z "$DB" ]; then missing="$missing SUPABASE_DB_URL"; fi
          if [ "$WHAT" = "traducir" ] && [ "$DRY" != "true" ] && [ -z "$ANTHROPIC" ]; then missing="$missing ANTHROPIC_API_KEY"; fi
          if [ "$WHAT" != "migraciones" ] && [ "$WHAT" != "informe-crm" ] && [ -z "$URL" ]; then missing="$missing PUBLIC_SUPABASE_URL"; fi
          if [ "$WHAT" != "migraciones" ] && [ "$WHAT" != "informe-crm" ] && [ -z "$KEY" ]; then missing="$missing SUPABASE_SERVICE_ROLE_KEY"; fi
          if [ -n "$missing" ]; then echo "::error::Faltan secretos:$missing (ver docs/PUESTA_EN_MARCHA.md, paso 3)"; exit 1; fi
          # Región de la base de datos (para elegir la misma en Vercel: docs/PUESTA_EN_MARCHA.md §Velocidad). Solo el host, nunca la URL.
          host=$(printf '%s' "$DB" | sed -E 's#^[a-z]+://([^@]*@)?([^:/?]+).*#\2#')
          case "$host" in
            *.pooler.supabase.com) echo "::notice::Región de Supabase: $(printf '%s' "$host" | sed -E 's/^aws-[0-9]+-([a-z0-9-]+)\.pooler.*/\1/')";;
            db.*.supabase.co) echo "::notice::Conexión directa a Supabase (la región se ve en Supabase → Project Settings → General)";;
          esac

      - uses: supabase/setup-cli@v1
        if: ${{ inputs.what == 'migraciones' || inputs.what == 'las-dos' }}
        with:
          version: latest

      - name: Migraciones (qué se aplicaría)
        if: ${{ (inputs.what == 'migraciones' || inputs.what == 'las-dos') && inputs.dry_run }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL" --dry-run
          echo "::notice::Era una PRUEBA: no se ha aplicado ninguna migración."

      - name: Migraciones (aplicar)
        if: ${{ (inputs.what == 'migraciones' || inputs.what == 'las-dos') && !inputs.dry_run }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: supabase db push --db-url "$SUPABASE_DB_URL" --yes

      # Informe del CRM (solo lectura: transacción de solo lectura; solo nombres de ciudad y números).
      - name: Informe del CRM
        if: ${{ inputs.what == 'informe-crm' }}
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TENANT: ${{ inputs.tenant }}
        run: |
          case "$TENANT" in *[!a-z0-9-]*|'') echo "::error::Nombre de espacio no válido"; exit 1;; esac
          sudo apt-get install -y -qq postgresql-client >/dev/null 2>&1 || true
          PGOPTIONS='-c default_transaction_read_only=on' psql "$SUPABASE_DB_URL" -v slug="$TENANT" -f scripts/crm-report.sql

      - uses: actions/setup-node@v5
        if: ${{ inputs.what != 'migraciones' && inputs.what != 'informe-crm' }}
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        if: ${{ inputs.what != 'migraciones' && inputs.what != 'informe-crm' }}
        run: npm ci

      - name: Alta del espacio
        if: ${{ inputs.what == 'alta-espacio' || inputs.what == 'las-dos' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAILS: ${{ inputs.admin_email }}
          TENANT: ${{ inputs.tenant }}
          DRY: ${{ inputs.dry_run }}
        run: |
          case "$TENANT" in *[!a-z0-9-]*|'') echo "::error::Nombre de espacio no válido"; exit 1;; esac
          # Si faltan archivos de marca (logo, fuente…), el alta sigue sin ellos y lo avisa; se añaden después y se repite.
          if [ "$DRY" = "true" ]; then
            npm run tenant:bootstrap -- "tenants/$TENANT" --allow-missing-assets --dry-run
            echo "::notice::Era una PRUEBA: no se ha escrito nada. Para dar de alta de verdad, repite con «Solo comprobar» desmarcado."
          else
            npm run tenant:bootstrap -- "tenants/$TENANT" --allow-missing-assets
            echo "::notice::Alta REAL hecha: espacio $TENANT creado o actualizado."
          fi

      - name: Dossiers de ejemplo
        if: ${{ inputs.what == 'dossiers-ejemplo' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAILS: ${{ inputs.admin_email }}
          TENANT: ${{ inputs.tenant }}
          DRY: ${{ inputs.dry_run }}
        run: |
          case "$TENANT" in *[!a-z0-9-]*|'') echo "::error::Nombre de espacio no válido"; exit 1;; esac
          if [ "$DRY" = "true" ]; then npm run tenant:samples -- "$TENANT" --dry-run; else npm run tenant:samples -- "$TENANT"; fi

      - name: Traducir el contenido
        if: ${{ inputs.what == 'traducir' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TENANT: ${{ inputs.tenant }}
          DRY: ${{ inputs.dry_run }}
        run: |
          case "$TENANT" in *[!a-z0-9-]*|'') echo "::error::Nombre de espacio no válido"; exit 1;; esac
          if [ "$DRY" = "true" ]; then npm run tenant:translate -- "$TENANT" --dry-run; else npm run tenant:translate -- "$TENANT"; fi

      - name: Superadmin
        if: ${{ inputs.what == 'superadmin' }}
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ADMIN_EMAILS: ${{ inputs.admin_email }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY" = "true" ]; then npx tsx scripts/superadmin.ts --dry-run; else npx tsx scripts/superadmin.ts; fi
