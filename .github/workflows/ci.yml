name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run lint:copy
      - run: npm test
      - run: npm run build

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/salessuite_test
      IT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/salessuite_it
      IT_DB_URI_BASE: postgres://authenticator:authenticator@localhost:5432
      POSTGREST_BIN: ./postgrest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: seed.sql al día con fixtures.json
        run: node scripts/build-seed.mjs && git diff --exit-code supabase/seed.sql
      - name: tenants/* válidos (estructura; los assets pendientes se avisan)
        run: npx tsx scripts/tenant-bootstrap.ts supabase/tests/tenant-fixture --dry-run
      - name: Migraciones + aserciones RLS/RPC
        run: bash supabase/tests/run-local.sh
      - name: PostgREST
        run: curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ
      - name: Contrato del servicio admin contra Postgres + PostgREST + RLS (supabase-js)
        run: bash supabase/tests/run-it.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Guardia de producción (sin Supabase ni DEMO_MODE → 503)
        run: |
          PORT=4322 HOST=127.0.0.1 node dist/server/entry.mjs &
          for _ in $(seq 1 30); do curl -s http://127.0.0.1:4322/api/health >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4322/admin/login)" = 503
      - name: Smoke E2E (modo DEMO)
        run: |
          DEMO_MODE=1 DEV_TENANT_SLUG=enjoy AI_RESEARCH_FIXTURE=1 PORT=4321 HOST=127.0.0.1 node dist/server/entry.mjs &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4321/admin/login >/dev/null && break; sleep 1; done
          node scripts/smoke-e2e.cjs
          node scripts/smoke-admin.cjs
          node scripts/smoke-tenant-admin.cjs
          node scripts/smoke-playbook.cjs
          node scripts/smoke-market.cjs
          node scripts/smoke-partner.cjs
          node scripts/smoke-evidence.cjs
          node scripts/smoke-mobile.cjs
          node scripts/smoke-notifications.cjs
          node scripts/smoke-accounts.cjs
          node scripts/smoke-commissions.cjs
          node scripts/smoke-i18n.cjs
          node scripts/smoke-start.cjs
          node scripts/smoke-analytics.cjs
          node scripts/smoke-daily.cjs
          node scripts/smoke-welcome.cjs
          node scripts/smoke-learn.cjs
          node scripts/smoke-crm.cjs
          node scripts/smoke-crm-people.cjs
          node scripts/smoke-spaces.cjs
          node scripts/smoke-followup.cjs
          node scripts/smoke-priority.cjs
          node scripts/smoke-route.cjs
          node scripts/smoke-ai-research.cjs
          node scripts/smoke-zones.cjs
          node scripts/smoke-google.cjs
          node scripts/smoke-map.cjs
          node scripts/smoke-cleanup.cjs
          node scripts/smoke-proposal-owners.cjs
          node scripts/smoke-rep-contact.cjs
      - name: Build para Vercel
        run: DEPLOY_TARGET=vercel npm run build
