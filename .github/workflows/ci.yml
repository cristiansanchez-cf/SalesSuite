name: CI
on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run lint:copy
      - run: npm test
      - run: npm run build
      - name: Todos los scripts/smoke-*.cjs están en el CI
        run: |
          diff <(ls scripts/smoke-*.cjs | sed 's|scripts/smoke-||; s|\.cjs$||' | sort) \
               <(grep -E '^ +smokes:' .github/workflows/ci.yml | sed 's/.*smokes://' | tr ' ' '\n' | grep . | sort)

  db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/salessuite_test
      IT_DATABASE_URL: postgres://postgres:postgres@localhost:5432/salessuite_it
      IT_DB_URI_BASE: postgres://authenticator:authenticator@localhost:5432
      POSTGREST_BIN: ./postgrest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: seed.sql al día con fixtures.json
        run: node scripts/build-seed.mjs && git diff --exit-code supabase/seed.sql
      - name: tenants/* válidos (estructura; los assets pendientes se avisan)
        run: npx tsx scripts/tenant-bootstrap.ts supabase/tests/tenant-fixture --dry-run
      - name: Migraciones + aserciones RLS/RPC
        run: bash supabase/tests/run-local.sh
      - name: PostgREST
        run: curl -sSL https://github.com/PostgREST/postgrest/releases/download/v12.2.3/postgrest-v12.2.3-linux-static-x64.tar.xz | tar xJ
      - name: Contrato del servicio admin contra Postgres + PostgREST + RLS (supabase-js)
        run: bash supabase/tests/run-it.sh

  e2e:
    # Los smokes van en 3 tandas en paralelo, cada una con su servidor DEMO (estado en memoria, propio).
    # Dentro de una tanda el orden importa: smoke-e2e antes que smoke-tenant-admin (cambia el color de la marca)
    # y smoke-org al final (convierte a rep@enjoy.test en gerente). docs/TESTING.md.
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            smokes: e2e admin tenant-admin playbook market partner evidence mobile recipes org
          - shard: 2
            smokes: notifications accounts commissions i18n start analytics daily welcome learn learn-detail auth profile
          - shard: 3
            smokes: personalize setup-ai live-screen rep admin-config
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Guardia de producción (sin Supabase ni DEMO_MODE → 503)
        if: matrix.shard == 1
        run: |
          PORT=4322 HOST=127.0.0.1 node dist/server/entry.mjs &
          for _ in $(seq 1 30); do curl -s http://127.0.0.1:4322/api/health >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4322/admin/login)" = 503
      - name: Smokes E2E (modo DEMO)
        run: |
          DEMO_MODE=1 DEV_TENANT_SLUG=enjoy PORT=4321 HOST=127.0.0.1 node dist/server/entry.mjs &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:4321/admin/login >/dev/null && break; sleep 1; done
          rc=0
          for s in ${{ matrix.smokes }}; do
            echo "::group::smoke-$s"
            start=$SECONDS
            node scripts/smoke-$s.cjs || { echo "::error::smoke-$s falla"; rc=1; }
            echo "::endgroup::"
            echo "smoke-$s: $((SECONDS - start)) s"
          done
          exit $rc
      - name: Build para Vercel
        if: matrix.shard == 1
        run: DEPLOY_TARGET=vercel npm run build
